<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="proj.css"><script src="shell.js"></script><script src="proj.js"></script><!-- size: 1520x1000 --></head><body>
<div class="title">1. Notion owns the board, Threadbear mirrors it<span>Each project's Notion page holds a Tasks database (To do, Doing, Waiting, Done). Zaran edits it in Notion, agents move cards through the Notion connector, and the runner reads it every few minutes. Read-only here: a click opens the card in Notion.</span></div>
<div id="win"></div>
<script>
const card = ([t, w, c, x]) => `<div class="card ${c === 'done' ? 'done' : ''}">${t}<div class="w">${I('person', 's')} ${w}${x ? ` <span class="tb"><span class="live"></span> thread</span>` : ''}</div></div>`
const main = `<div class="thread">${pageTop(`<span class="lk notion">${I('notion', 's')} Notion</span>`)}
  <div class="h">${I('board', 's')} Tasks <span class="r">${I('notion', 's')} From Notion, 2m ago</span></div>
  <div class="cols4">${COLS.map(([k, n]) => {
    const ts = TASKS.filter(t => t[2] === k)
    return `<div class="colm"><div class="ch">${n}<span>${ts.length}</span></div>${ts.slice(0, k === 'done' ? 2 : 9).map(card).join('')}${k === 'done' ? '<div class="w" style="color:var(--faint);font-size:12px;padding:2px 4px">+1 more</div>' : ''}</div>`
  }).join('')}</div>
  </div></div>`
shell({ side: projectsSide(), main, pane: highlightsPane() })
document.querySelector('.pane .pbody').innerHTML = `<div class="ph">Tasks</div>
  <div class="lib brief"><div><span>•</span><span>4 waiting on Zaran, oldest the Eventbrite link (9 days)</span></div><div><span>•</span><span>Mike: sign artworks next</span></div></div>
  <div class="ph">Threads</div>
  <div class="prow">${I('chat', 's')}<div>Zaran's email about the competition<div class="sub">Fixes from the 30 Oct reply</div></div></div>`
</script></body></html>
